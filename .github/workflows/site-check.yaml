name: site-check

# サイト（index.html）を更新したときと、毎日1回、サイト全体を自動で検査する。
# 問題があれば赤い×になる（Actions タブで「site-check」を開くと、どこがおかしいか一覧が見られる）
on:
  push:
    paths:
      - "index.html"
      - "tests/**"
      - "scripts/core.js"
      - ".github/workflows/site-check.yaml"
  schedule:
    - cron: "30 3 * * *"   # 毎日 JST 12:30
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      # 日本語フォント（ないと文字の幅が変わって、はみ出しを誤って検出することがある）
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python tests/site_check.py
      # マジック計算を全通りの総当たりで検証（回避確定・最下位確定・M が正しいか）
      - run: node tests/magic_bruteforce.js
