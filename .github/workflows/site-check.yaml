name: site-check

# サイト全体の検査。手動のときだけ動かす（Actions → site-check → Run workflow）
# （前は、ファイルを上げるたび・毎日1回に自動で動いていたが、ファイルを1つずつ上げる途中の状態で失敗して
#   そのたびにメールが届いていたのでやめた。検査はサイトを渡す前に毎回すませている）
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      # 日本語フォント（ないと文字の幅が変わって、はみ出しを誤って検出することがある）
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python tests/site_check.py
      # マジック計算を全通りの総当たりで検証（回避確定・最下位確定・M が正しいか）
      - run: node tests/magic_bruteforce.js
